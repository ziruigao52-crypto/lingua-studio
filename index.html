<script>
  /**
   * 1. 渲染统一格式的逐字稿到右侧面板
   */
  function renderTranscript(data) {
    const container = document.getElementById('transcript-container') || document.querySelector('.transcript-list');
    if (!container) return;
    container.innerHTML = '';

    if (data && data.error) {
      container.innerHTML = `<div class="text-amber-400 p-4 text-sm text-center">${data.error}</div>`;
      return;
    }

    if (!data || !data.events || data.events.length === 0) {
      container.innerHTML = '<div class="text-gray-400 p-4 text-center">暂无可用字幕内容</div>';
      return;
    }

    data.events.forEach(event => {
      if (!event.segs) return;
      const text = event.segs.map(seg => seg.utf8 || '').join('');
      if (!text.trim() || text === '\n') return;

      const startMs = parseInt(event.tStartMs || 0, 10);
      const totalSeconds = Math.floor(startMs / 1000);
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      const timeFormatted = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

      const item = document.createElement('div');
      item.className = 'transcript-item p-2 rounded hover:bg-gray-800/60 cursor-pointer flex gap-3 transition-colors text-sm mb-1';
      item.innerHTML = `
        <span class="text-amber-400 font-mono text-xs select-none shrink-0">${timeFormatted}</span>
        <span class="text-gray-200 leading-relaxed">${text}</span>
      `;
      container.appendChild(item);
    });
  }

  /**
   * 2. 拦截全局 fetch 请求，实现输入框链接自动向后端发送并渲染
   */
  const originalFetch = window.fetch;
  window.fetch = async function(url, options) {
    if (typeof url === "string" && url.includes("/api/transcript") && (!options || options.method !== 'POST')) {
      const input = document.querySelector("input");
      const val = input ? input.value.trim() : "";
      if (val) {
        url = `/api/transcript?url=${encodeURIComponent(val)}`;
      }
    }

    const response = await originalFetch.call(this, url, options);
    if (typeof url === "string" && url.includes("/api/transcript")) {
      try {
        const clone = response.clone();
        const data = await clone.json();
        renderTranscript(data);
      } catch (e) {
        console.error("Failed to parse transcript:", e);
      }
    }
    return response;
  };

  /**
   * 3. 自动在输入框下方注入“上传本地音视频文件”的交互按钮
   */
  window.addEventListener('DOMContentLoaded', () => {
    const input = document.querySelector('input');
    if (!input || !input.parentElement) return;

    // 避免重复注入
    if (document.getElementById('local-media-upload')) return;

    const uploadWrapper = document.createElement('div');
    uploadWrapper.className = 'mt-3 flex items-center gap-3 text-xs text-gray-400';
    uploadWrapper.innerHTML = `
      <label class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded bg-gray-800 hover:bg-gray-700 text-amber-400 border border-gray-700 transition-colors">
        <span>📁 上传本地音视频生成字幕 (MP3/MP4/WAV)</span>
        <input type="file" id="local-media-upload" accept="audio/*,video/*" class="hidden" />
      </label>
      <span id="upload-status"></span>
    `;
    input.parentElement.parentElement.appendChild(uploadWrapper);

    const fileInput = document.getElementById('local-media-upload');
    const statusText = document.getElementById('upload-status');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusText.textContent = '正在上传并调用 AI 转写字幕，请稍候...';
      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/api/transcript', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        statusText.textContent = res.ok ? '✅ 生成完成' : '❌ 生成失败';
        renderTranscript(data);
      } catch (err) {
        statusText.textContent = '❌ 网络异常';
        console.error(err);
      }
    });
  });
</script>
